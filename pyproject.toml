[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["taxon"]

[project]
name = "taxon"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "pydantic",
  "sqlalchemy",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "httpx",
  "mypy",
  "pytest",
  "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["taxon/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["taxon"]
